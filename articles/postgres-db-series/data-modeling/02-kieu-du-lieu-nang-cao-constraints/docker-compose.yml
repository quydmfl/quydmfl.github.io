services:
  postgres:
    image: docker.io/postgres:16-alpine
    container_name: pg-data-modeling-02
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: booking
    ports:
      - "5432:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - pg-data-modeling-02-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pg-data-modeling-02-data:
