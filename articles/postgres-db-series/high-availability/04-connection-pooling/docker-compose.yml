services:
  postgres:
    image: docker.io/postgres:16-alpine
    container_name: pg-ha-04
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: appdb
    command:
      - "postgres"
      - "-c"
      - "max_connections=20"
    ports:
      - "5432:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - pg-ha-04-data:/var/lib/postgresql/data
    restart: unless-stopped

  pgbouncer:
    image: docker.io/edoburu/pgbouncer:1.21.0-p1
    container_name: pg-ha-04-pgbouncer
    environment:
      DATABASE_URL: "postgres://demo:demo@postgres:5432/appdb"
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 10
    ports:
      - "6432:5432"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pg-ha-04-data:
