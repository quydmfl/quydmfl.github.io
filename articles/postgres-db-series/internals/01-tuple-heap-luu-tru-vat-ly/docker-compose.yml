services:
  postgres:
    image: docker.io/postgres:16-alpine
    container_name: pg-internals-01
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: storage
    ports:
      - "5432:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - pg-internals-01-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pg-internals-01-data:
