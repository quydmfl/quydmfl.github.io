# Cấu hình Vector tối thiểu: thu log của các container trong compose stack
# rồi đẩy sang VictoriaLogs qua giao thức Elasticsearch bulk API.
# Xem bài 04 để biết cách parse/enrich dữ liệu trước khi ghi.

sources:
  docker_logs:
    type: docker_logs
    # Không set include_containers -> Vector lấy log của MỌI container
    # đang chạy trên cùng Docker host, kể cả chính nó và victorialogs.

sinks:
  victorialogs:
    type: elasticsearch
    inputs:
      - docker_logs
    endpoints:
      - "http://victorialogs:9428/insert/elasticsearch/"
    mode: bulk
    api_version: v8
    compression: gzip
    healthcheck:
      enabled: false
    query:
      # _msg_field: field nào trong event sẽ trở thành nội dung log (_msg)
      _msg_field: message
      # _time_field: field nào là timestamp của log entry
      _time_field: timestamp
      # _stream_fields: các field dùng để nhóm log thành "stream" trong
      # VictoriaLogs (tương tự label set của Loki) — càng ít field càng tốt
      # để tránh bùng nổ số lượng stream.
      _stream_fields: container_name,host
