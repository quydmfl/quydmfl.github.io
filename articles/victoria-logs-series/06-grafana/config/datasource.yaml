# Grafana provisioning: tự động tạo datasource VictoriaLogs khi container
# khởi động, thay vì phải bấm "Add data source" thủ công qua UI.
apiVersion: 1

datasources:
  - name: VictoriaLogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victorialogs:9428
    isDefault: true
    jsonData:
      httpMethod: POST
